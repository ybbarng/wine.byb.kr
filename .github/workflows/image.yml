name: Image

# Docker 이미지 두 개(앱·도구)를 빌드해 GHCR 에 올린다. 서버는 이 이미지를 받아 띄우기만 한다.
#   ghcr.io/ybbarng/wine.byb.kr        — 앱 (Dockerfile 의 runner)
#   ghcr.io/ybbarng/wine.byb.kr-tools  — DB 반영·시드·백업 덤프 (Dockerfile 의 tools)
# 태그: 커밋 sha 는 항상, main 이면 latest 도.

on:
  push:
    branches: [main, docker-image]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - target: runner
            image: ghcr.io/ybbarng/wine.byb.kr
          - target: tools
            image: ghcr.io/ybbarng/wine.byb.kr-tools
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 두 타깃이 deps·build 단계를 같이 쓰므로 캐시를 나눠 갖는다
          cache-from: type=gha,scope=wine
          cache-to: type=gha,scope=wine,mode=max
