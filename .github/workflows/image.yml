name: Image

# Docker 이미지 두 개(앱·도구)를 빌드해 GHCR 에 올린다. 서버는 이 이미지를 받아 띄우기만 한다.
#   ghcr.io/ybbarng/wine.byb.kr        — 앱 (Dockerfile 의 runner)
#   ghcr.io/ybbarng/wine.byb.kr-tools  — DB 반영·시드·백업 덤프 (Dockerfile 의 tools)
# 태그: 커밋 sha 는 항상, main 이면 latest 도.

on:
  push:
    branches: [main, docker-image]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - target: runner
            image: ghcr.io/ybbarng/wine.byb.kr
          - target: tools
            image: ghcr.io/ybbarng/wine.byb.kr-tools
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 두 타깃이 deps·build 단계를 같이 쓰므로 캐시를 나눠 갖는다
          cache-from: type=gha,scope=wine
          cache-to: type=gha,scope=wine,mode=max

  # 서버에 배포한다. 서버의 배포 키는 forced-command 로 servers 저장소의 apps/wine/deploy.sh 만 실행한다.
  # 이미지를 받을 토큰은 이 실행의 GITHUB_TOKEN 을 표준입력으로 넘긴다(서버에 남지 않고, 실행이 끝나면 만료된다).
  # main 이면 운영 배포, 그 밖의 브랜치면 DB 사본으로 띄워 확인만 하는 시험(test).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: SSH → deploy.sh
        env:
          KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          PORT: ${{ secrets.SERVER_PORT || '22' }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ github.ref == 'refs/heads/main' && 'deploy' || 'test' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf '%s\n' "$TOKEN" | ssh -i ~/.ssh/deploy_key -p "$PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            "$USER@$HOST" "$MODE $GITHUB_SHA"
          rm -f ~/.ssh/deploy_key
