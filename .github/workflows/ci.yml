name: CI

# 코드 변경마다 린트·타입체크·테스트·빌드를 돈다. 이미지 빌드·배포는 image.yml이 담당한다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # typecheck·build가 각자 prisma generate를 포함한다(서버 빌드와 동일 흐름이라 여기서 통과하면 서버도 통과).
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build # 렌더·CSS·라우트 오류를 조기에 잡는다(DB 조회 페이지는 force-dynamic)
