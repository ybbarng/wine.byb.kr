# wine.byb.kr — nginx 리버스 프록시
# /etc/nginx/sites-available/wine.byb.kr 로 두고 sites-enabled 에 심볼릭 링크.
# HTTPS(443) 블록은 `certbot --nginx -d wine.byb.kr` 가 자동으로 추가한다.
#
# 앱 포트(3103)는 서버 .env 의 PORT 와 일치해야 한다. 포트를 바꾸면 여기도 함께 바꾼다.

server {
    listen 80;
    listen [::]:80;
    server_name wine.byb.kr;

    location / {
        proxy_pass http://127.0.0.1:3103;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
